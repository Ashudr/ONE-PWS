<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ONEPWS | Project Board</title>

    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/projectboard.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="top-header">

        <div class="logo-area">

            <img src="../../assets/images/onepws-logo.png" alt="ONEPWS Logo">

            <div>

                <h2>ONEPWS</h2>

                <p>Enterprise Project Management System</p>

            </div>

        </div>

        <div class="header-actions">

            <input
                type="text"
                id="searchProject"
                placeholder="Search Project...">

            <button id="notificationBtn">🔔</button>

            <button id="profileBtn">Ashu ▼</button>

        </div>

    </header>

    <!-- ================= MAIN ================= -->

    <div class="main-wrapper">

    <!-- ==========================================
                    SIDEBAR
    =========================================== -->

<aside class="sidebar">

    <div class="logo">

        <i class="fa-solid fa-layer-group"></i>

        <span>ONEPWS</span>

    </div>

    <nav>

        <ul>

            <li>
                <a href="../dashboard/dashboard.html">

                    <i class="fa-solid fa-chart-line"></i>

                    Dashboard

                </a>
            </li>

            <li>
                <a href="../projectwizard/projectwizard.html">

                    <i class="fa-solid fa-folder-plus"></i>

                    Project Wizard

                </a>
            </li>

            <li class="active">
                <a href="#">

                    <i class="fa-solid fa-table-columns"></i>

                    Project Board

                </a>
            </li>

            <li>
                <a href="../taskboard/taskboard.html">

                    <i class="fa-solid fa-list-check"></i>

                    Task Board

                </a>
            </li>

            <li>
                <a href="../projectprogress/projectprogress.html">

                    <i class="fa-solid fa-chart-pie"></i>

                    Progress Board

                </a>
            </li>

            <li>
                <a href="../reports/reports.html">

                    <i class="fa-solid fa-file-lines"></i>

                    Reports

                </a>
            </li>

            <li>
                <a href="../settings/settings.html">

                    <i class="fa-solid fa-gear"></i>

                    Settings

                </a>
            </li>

        </ul>

    </nav>

</aside>

</aside>

        <!-- CONTENT -->

        <main class="content">

            <!-- PAGE TITLE -->

            <section class="page-header">

                <h1>
                    Project Board
                </h1>

                <button id="newProject">
                    + New Project
                </button>

            </section>

            <!-- KPI -->

            <section class="kpi-container">

                <div class="kpi-box">

                    <h3>Active</h3>

                    <h2>18</h2>

                </div>

                <div class="kpi-box">

                    <h3>Completed</h3>

                    <h2>12</h2>

                </div>

                <div class="kpi-box">

                    <h3>Critical</h3>

                    <h2>2</h2>

                </div>

                <div class="kpi-box">

                    <h3>On Hold</h3>

                    <h2>3</h2>

                </div>

            </section>

            <!-- FILTERS -->

            <section class="filter-row">

                <select>

                    <option>Financial Year</option>

                </select>

                <select>

                    <option>Customer</option>

                </select>

                <select>

                    <option>Project Manager</option>

                </select>

                <select>

                    <option>Status</option>

                </select>

            </section>

            <!-- PROJECT GRID -->

            <section class="project-grid"
         id="projectGrid">

</section>

        </main>

    </div>

    <script src="../../assets/js/database.js"></script>

<script src="../../assets/js/projectboard.js"></script>

</body>

</html>
