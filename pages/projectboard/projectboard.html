<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ONEPWS | Project Board</title>

    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/projectboard.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="top-header">

        <div class="logo-area">

            <img src="../../assets/images/onepws-logo.png" alt="ONEPWS Logo">

            <div>

                <h2>ONEPWS</h2>

                <p>Enterprise Project Management System</p>

            </div>

        </div>

        <div class="header-actions">

            <input
                type="text"
                id="searchProject"
                placeholder="Search Project...">

            <button id="notificationBtn">🔔</button>

            <button id="profileBtn">Ashu ▼</button>

        </div>

    </header>

    <!-- ================= MAIN ================= -->

    <div class="main-wrapper">

        <!-- SIDEBAR -->

        <aside class="sidebar">

    <button onclick="window.location.href='../dashboard/dashboard.html'">
        🏠 Dashboard
    </button>

    <button class="active">
        📁 Project Board
    </button>

    <button onclick="window.location.href='../taskboard/taskboard.html'">
        📋 Task Board
    </button>

    <button onclick="window.location.href='../projectprogress/projectprogress.html'">
        📊 Progress Board
    </button>

    <button>
        📈 Reports
    </button>

    <button>
        👥 Users
    </button>

    <button>
        ⚙ Settings
    </button>

    <button>
        🚪 Logout
    </button>

</aside>

        <!-- CONTENT -->

        <main class="content">

            <!-- PAGE TITLE -->

            <section class="page-header">

                <h1>
                    Project Board
                </h1>

                <button id="newProject">
                    + New Project
                </button>

            </section>

            <!-- KPI -->

            <section class="kpi-container">

                <div class="kpi-box">

                    <h3>Active</h3>

                    <h2>18</h2>

                </div>

                <div class="kpi-box">

                    <h3>Completed</h3>

                    <h2>12</h2>

                </div>

                <div class="kpi-box">

                    <h3>Critical</h3>

                    <h2>2</h2>

                </div>

                <div class="kpi-box">

                    <h3>On Hold</h3>

                    <h2>3</h2>

                </div>

            </section>

            <!-- FILTERS -->

            <section class="filter-row">

                <select>

                    <option>Financial Year</option>

                </select>

                <select>

                    <option>Customer</option>

                </select>

                <select>

                    <option>Project Manager</option>

                </select>

                <select>

                    <option>Status</option>

                </select>

            </section>

            <!-- PROJECT GRID -->

            <section class="project-grid"
         id="projectGrid">

</section>

        </main>

    </div>

    <script src="../../assets/js/database.js"></script>

<script src="../../assets/js/projectboard.js"></script>

</body>

</html>
