<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ONEPWS | New Project</title>

    <link rel="stylesheet"
          href="../../assets/css/style.css">

    <link rel="stylesheet"
          href="../../assets/css/projectwizard.css">

</head>

<body>

<header class="top-header">

    <h2>Create New Project</h2>

</header>

<div class="wizard">

    <!-- Progress -->

    <div class="steps">

        <div class="step active">1<br>Project</div>

        <div class="step">2<br>Template</div>

        <div class="step">3<br>Modules</div>

        <div class="step">4<br>Review</div>

    </div>

    <!-- STEP 1 -->

    <div class="step-page">

        <h2>Project Details</h2>

        <div class="form-grid">

            <input
                type="text"
                placeholder="SAP Project ID">

            <input
                type="text"
                placeholder="Project Name">

            <input
                type="text"
                placeholder="Customer">

            <input
                type="text"
                placeholder="Business Unit">

            <input
                type="text"
                placeholder="Location">

            <input
                type="text"
                placeholder="BUH">

            <input
                type="text"
                placeholder="Project Head">

            <input
                type="text"
                placeholder="Design Head">

            <input
                type="text"
                placeholder="Project Manager">

            <input
                type="date">

            <input
                type="date">

            <select>

                <option>Priority</option>

                <option>High</option>

                <option>Medium</option>

                <option>Low</option>

            </select>

        </div>

        <div class="buttons">

            <button id="nextBtn">

                Next →

            </button>

        </div>

    </div>

</div>

<script src="../../assets/js/projectwizard.js"></script>

</body>

</html>
