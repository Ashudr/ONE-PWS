<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ONEPWS | New Project</title>

    <link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/theme.css">
<link rel="stylesheet" href="../../assets/css/layout.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/projectwizard.css">

</head>

<body>

<div class="wizard-container">

    <h1>Create New Project</h1>

    <!-- Progress Bar -->

    <div class="wizard-progress">

        <div class="wizard-step active">

            <div class="circle">1</div>

            <span>Template</span>

        </div>

        <div class="line"></div>

        <div class="wizard-step">

            <div class="circle">2</div>

            <span>Project Details</span>

        </div>

        <div class="line"></div>

        <div class="wizard-step">

            <div class="circle">3</div>

            <span>Modules</span>

        </div>

        <div class="line"></div>

        <div class="wizard-step">

            <div class="circle">4</div>

            <span>Review</span>

        </div>

    </div>

    <!-- STEP 1 -->

    <div class="step-page active-page" id="step1">

        <h2>Select Project Template</h2>

        <div class="template-grid">

           <button class="template-btn"

        data-template="Office">

    Office

</button>

            <button class="template-btn">Retail</button>

            <button class="template-btn">Hospital</button>

            <button class="template-btn">Hotel</button>

            <button class="template-btn">Industrial</button>

            <button class="template-btn">Custom</button>

        </div>

    </div>

    <!-- STEP 2 -->

    <div class="step-page" id="step2">

        <section class="wizard-step-content">

    <h2>Project Details</h2>

    <div class="form-grid">

        <div class="form-group">
            <label>Project Number</label>
            <input type="text" id="projectNumber" readonly>
        </div>

        <div class="form-group">
            <label>Project Name</label>
            <input type="text" id="projectName" placeholder="Enter Project Name">
        </div>

        <div class="form-group">
            <label>Customer</label>
            <select id="customer">
                <option value="">Select Customer</option>
                <option>ABC Pvt Ltd</option>
                <option>XYZ Industries</option>
                <option>DEF Corporation</option>
            </select>
        </div>

        <div class="form-group">
            <label>Business Unit</label>
            <select id="businessUnit">
                <option>Corporate</option>
                <option>Retail</option>
                <option>Healthcare</option>
                <option>Hospitality</option>
            </select>
        </div>

        <div class="form-group">
            <label>Project Manager</label>
            <select id="projectManager">
                <option>Ashu</option>
                <option>Manager 2</option>
                <option>Manager 3</option>
            </select>
        </div>

        <div class="form-group">
            <label>Design Head</label>
            <select id="designHead">
                <option>Select Design Head</option>
                <option>Design Head 1</option>
                <option>Design Head 2</option>
            </select>
        </div>

        <div class="form-group">
            <label>Priority</label>

            <select id="priority">
                <option>Low</option>
                <option selected>Medium</option>
                <option>High</option>
                <option>Critical</option>
            </select>

        </div>

        <div class="form-group">
            <label>Start Date</label>
            <input type="date" id="startDate">
        </div>

        <div class="form-group">
            <label>Target Completion</label>
            <input type="date" id="endDate">
        </div>

        <div class="form-group full-width">
            <label>Description</label>

            <textarea id="description"
                      rows="4"
                      placeholder="Project Description"></textarea>

        </div>

    </div>

</section>
    </div>

    <!-- STEP 3 -->

    <div class="step-page" id="step3">

        <h2>Module Selection</h2>

        <p>This page will be built later.</p>

    </div>

    <!-- STEP 4 -->

    <div class="step-page" id="step4">

        <h2>Review Project</h2>

        <p>This page will be built later.</p>

    </div>

    <div class="wizard-buttons">

    <button id="cancelBtn">

        Cancel

    </button>

    <button id="prevBtn">

        ← Previous

    </button>

    <button id="nextBtn">

        Next →

    </button>

</div>

</div>

<script src="../../assets/js/projectwizard.js"></script>

</body>
