<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ONEPWS - Task Board</title>


<!-- COMMON CSS -->
<link rel="stylesheet" href="../../assets/css/style.css">

<!-- TASK BOARD CSS -->
<link rel="stylesheet" href="../../assets/css/taskboard.css">


<!-- ICONS -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>


<body>


<div class="taskboard-container">


<!-- HEADER -->

<div class="taskboard-header">

    <div>
        <h2>
            <i class="fa-solid fa-layer-group"></i>
            Task Board
        </h2>

        <p>
            Project Management Workflow
        </p>

    </div>


    <button class="add-task-btn">

        <i class="fa-solid fa-plus"></i>
        Add Task

    </button>


</div>



<!-- BOARD -->

<div class="kanban-board">



<!-- RFQ -->

<div class="kanban-column">

<div class="column-header rfq">

RFQ

<span>3</span>

</div>



<div class="card-area">


<div class="task-card">

<div class="time-left">
<i class="fa-regular fa-clock"></i>
2D 06H
</div>


<h4>
Project Alpha
</h4>


<p>
ABC Industries
</p>


<div class="card-footer">

<span>
<i class="fa-solid fa-user"></i>
Ashu
</span>


<span>
<i class="fa-solid fa-flag"></i>
High
</span>


</div>


</div>

</div>

</div>





<!-- INFO MISSING -->


<div class="kanban-column">


<div class="column-header info">

INFO MISSING

<span>2</span>

</div>


<div class="card-area">


<div class="task-card">

<div class="time-left warning">

<i class="fa-regular fa-clock"></i>

5H LEFT

</div>


<h4>
Drawing Review
</h4>


<p>
Customer Data
</p>


<div class="card-footer">

<span>
<i class="fa-solid fa-user"></i>
RK
</span>


<span>
<i class="fa-solid fa-circle-exclamation"></i>
</span>


</div>


</div>


</div>


</div>






<!-- WIP -->


<div class="kanban-column">


<div class="column-header wip">

WIP

<span>5</span>

</div>



<div class="card-area">


<div class="task-card">


<div class="time-left">

<i class="fa-regular fa-clock"></i>

10D

</div>


<h4>
Panel Design
</h4>


<p>
XYZ Client
</p>


<div class="card-footer">

<span>
<i class="fa-solid fa-user"></i>
SK
</span>


<span>
Medium
</span>

</div>


</div>


</div>



</div>






<!-- QC -->


<div class="kanban-column">


<div class="column-header qc">

QC

<span>4</span>

</div>


<div class="card-area">


</div>


</div>







<!-- RESOLVED -->


<div class="kanban-column">


<div class="column-header resolved">

RESOLVED

<span>6</span>

</div>


<div class="card-area">


</div>


</div>








<!-- COMPLETED -->


<div class="kanban-column">


<div class="column-header completed">

COMPLETED

<span>10</span>

</div>


<div class="card-area">


<div class="task-card completed-card">


<div class="time-left">

<i class="fa-solid fa-check"></i>

DONE

</div>


<h4>
Door Module
</h4>


<p>
Completed
</p>



<div class="card-footer">

<span>
<i class="fa-solid fa-user"></i>
AM
</span>


</div>


</div>


</div>


</div>





</div>



</div>


<script src="../../assets/js/taskboard.js"></script>


</body>

</html>
