<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ONEPWS | Dashboard</title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="../../assets/css/base.css">

    <link rel="stylesheet"
          href="../../assets/css/theme.css">

    <link rel="stylesheet"
          href="../../assets/css/layout.css">

    <link rel="stylesheet"
          href="../../assets/css/components.css">

    <link rel="stylesheet"
          href="../../assets/css/dashboard.css">

</head>

<body>
<h1 style="color:red;font-size:60px;">
THIS IS MY NEW DASHBOARD
</h1>

<div class="dashboard-wrapper">

<!-- ===========================================================
TOP HEADER
=========================================================== -->

<header class="top-header">

    <div class="header-left">

        <img src="../../assets/images/onepws-logo.png"
             class="logo">

        <div>

            <h2>ONEPWS</h2>

            <span>
                Enterprise Project Management System
            </span>

        </div>

    </div>

    <div class="header-center">

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input type="text"
                   placeholder="Search Projects, Customers, Users...">

        </div>

    </div>

    <div class="header-right">

        <button class="icon-button">

            <i class="fa-regular fa-bell"></i>

            <span class="notification-count">

                5

            </span>

        </button>

        <button class="icon-button">

            <i class="fa-regular fa-envelope"></i>

            <span class="notification-count">

                2

            </span>

        </button>

        <div class="profile-box">

            <img src="../../assets/images/profile.png">

            <div>

                <strong>Ashu</strong>

                <small>Administrator</small>

            </div>

            <i class="fa-solid fa-chevron-down"></i>

        </div>

    </div>

</header>

<!-- ===========================================================
MAIN
=========================================================== -->

<div class="dashboard-main">

<!-- ===========================================================
SIDEBAR
=========================================================== -->

<aside class="sidebar">

    <div class="menu-title">

        MAIN MENU

    </div>

    <a class="menu-item active">

        <i class="fa-solid fa-table-columns"></i>

        Dashboard

    </a>

    <a class="menu-item">

        <i class="fa-solid fa-diagram-project"></i>

        Project Board

    </a>

    <a class="menu-item">

        <i class="fa-solid fa-list-check"></i>

        Task Board

    </a>

    <a class="menu-item">

        <i class="fa-solid fa-chart-line"></i>

        Progress Board

    </a>

    <a class="menu-item">

        <i class="fa-solid fa-chart-pie"></i>

        Reports

    </a>

    <a class="menu-item">

        <i class="fa-solid fa-users"></i>

        Users

    </a>

    <a class="menu-item">

        <i class="fa-solid fa-gear"></i>

        Settings

    </a>

    <a class="menu-item logout">

        <i class="fa-solid fa-right-from-bracket"></i>

        Logout

    </a>

</aside>

<!-- ===========================================================
CONTENT
=========================================================== -->

<section class="dashboard-content">

<div class="welcome-banner">

    <div>

        <h1>

            Welcome Back, Ashu 👋

        </h1>

        <p>

            Here is today's overview of your organization.

        </p>

    </div>

    <button class="primary-btn">

        <i class="fa-solid fa-plus"></i>

        Create New Project

    </button>

</div>
